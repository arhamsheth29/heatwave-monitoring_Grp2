<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset ="UTF-8">
    <title>Heatwave Monitoring Form</title>
	<style>
	
	body{
	font-family: Arial;
	background: #f4f6f8;
	padding: 20px;
	}
	
	fieldset{
	max-width: 500px;
	margin:auto;
	background: #fff;
	border-radius: 8px;
	padding: 20px;
	}
	
	legend{
	font-weight: bold;
	font-size: 1.2em;
	color: #c0392b;
	}
	
	label{
	display: block;
	margin-top : 10px;
	}
	
	input,select{
	width:100%;
	padding:6px;
	margin-top:4px;
	box-sizing:border-box;
	}
	
	button{
	margin-top: 18px;
	padding: 10px 20px;
	background: #c0392b;
	color: #fff;
	border: none;
	border-radius: 4px;
	cursor:pointer;
	}
	
	</style>
</head>
<body>

    <form>
     <fieldset>
	 <legend>Heatwave Monitoring Form</legend>
        <label for ="observerName">Observer Name</label>
        <input type="text" id="observerName" name="observerName" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for ="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile" required>
  
        <label for ="stationId">AWS Station ID</label>
        <input type="text" id="stationId" name="stationId" required>
		
        <label for ="location">Location</label>
        <input type="text" id="location" name="location" required>
       
        <label for ="obsDate">Observation Date</label>
        <input type="date" id="obsDate" name="obsDate" required>
		
		<label for ="maxTemp">Maximum Temperature</label>
        <input type="number" id="maxTemp" name="maxTemp" required>
		
		<label for ="humidity">Humidity</label>
        <input type="number" id="humidity" name="humidity" required>
		
        <label for="alertLevel">Heatwave Alert Level</label>
		<select id = "alertLevel" name = "alertLevel" required>
		<option value="">Select</option>
		<option value="Low">Low</option>
		<option value="Moderate">Moderate</option>
		<option value="High">High</option>
		<option value="Severe">Severe</option>
        </select>
		
        <button type = "submit">Submit</button>
     </fieldset>
	 </form>

</body>
</html>
