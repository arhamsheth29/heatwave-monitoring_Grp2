<html>
<head>
    <meta charset="UTF-8">
    <title>Heatwave Risk and Early Warning</title>
    <style>
        body { 
		font-family: Arial; 
		background-color: #fdf6f0; 
		padding: 20px; 
		}
        h1 { 
		color: #b30000; 
		text-align: center; 
		}
        .box { 
		max-width: 500px; 
		margin: auto; 
		background: #fff; 
		border: 2px solid #b30000;
        border-radius: 10px; 
		padding: 15px 25px; 
		box-shadow: 2px 2px 10px rgba(0,0,0,0.2); 
		}
    </style>
</head>
<body>
    <h1>Heatwave Risk and Early-Warning Decision</h1>
    <div class="box">
    <script type="text/javascript">
        var locationName = "Pune";
        var temperature = 39;
        var humidity = 65;
        var forecastTemp = 38;
        var heatwaveCondition = true;       
        var vulnerableAlert = true;         

        var riskLevel;
        var recommendation;

        if (temperature >= 40) {
            riskLevel = "SEVERE";
            recommendation = "Severe Heatwave Warning";
        } else if (temperature >= 38 && humidity >= 60) {
            riskLevel = "HIGH";
            recommendation = "High Heat Risk - Issue Heatwave Warning";
        } else if (forecastTemp >= 40) {
            riskLevel = "EARLY WARNING";
            recommendation = "Early Warning - Prepare for Heatwave";
        } else if (temperature >= 35 && temperature < 40) {
          
            riskLevel = "MODERATE";
            recommendation = "Moderate Heat Risk - Monitor Conditions";
        } else {
            riskLevel = "NORMAL";
            recommendation = "Normal - Continue Monitoring";
        }

        document.write("<p><b>Location:</b> " + locationName + "</p>");
        document.write("<p><b>Temperature:</b> " + temperature + "&deg;C</p>");
        document.write("<p><b>Humidity:</b> " + humidity + "%</p>");
        document.write("<p><b>Forecast Temperature:</b> " + forecastTemp + "&deg;C</p>");
        document.write("<p><b>Heatwave Condition:</b> " + (heatwaveCondition ? "Active" : "Not Active") + "</p>");
        document.write("<hr>");
        document.write("<p><b>Risk Level:</b> <span style='color:#b30000;'>" + riskLevel + "</span></p>");
        document.write("<p><b>Recommendation:</b> " + recommendation + "</p>");

        if (vulnerableAlert && (riskLevel == "SEVERE" || riskLevel == "HIGH" || riskLevel == "EARLY WARNING")) {
            document.write("<p style='color:#b30000;'><b>Special Alert:</b> Notify senior citizens, children and outdoor workers.</p>");
        }

        console.log("Risk Level: " + riskLevel);
        console.log("Recommendation: " + recommendation);
    </script>
    </div>
</body>
</html>
