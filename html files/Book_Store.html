
<html>
<head>
    <title>My Book Store</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5ead7;
        }

        .book {
            background-color: #ead7b7;
        }
    </style>
</head>

<body>

    <h1 class="text-center text-success mt-3">
        My Book Store
    </h1>

    <p class="text-center">
        Welcome to my book store
    </p>

    <div class="container">

        <h2 class="text-success">Available Books</h2>

        <div class="book border p-3">
            <h3>Harry Potter</h3>
            <p>Price: ₹500</p>
            <button class="btn btn-success">Buy Now</button>
        </div>

        <br>

        <div class="book border p-3">
            <h3>The Alchemist</h3>
            <p>Price: ₹300</p>
            <button class="btn btn-success">Buy Now</button>
        </div>

    </div>

</body>
</html>
