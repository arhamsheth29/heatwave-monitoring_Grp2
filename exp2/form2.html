<html>
<head>
    <title>Heatwave Advisory Subscription Form</title>
	<link rel="stylesheet" href="style.css">
	<style>
	fieldset{
	width: 350px;
	margin:20px auto;
	border: 2px solid #b30000;
	border-radius: 10px;
	padding: 20px;}
	
legend{
	font-weight: bold;
	color: #b30000;
	padding: 0 10px;}
	
	label{
	display: block;
	margin-top = 10px;}
	
	input[type="text"],
	input[type="email"],
	input[type="tel"],
	select{
	width: 100%;
	padding: 8px;
	margin-top: 5px;
	border: 1px solid #ccc;
	border-radius: 6px;
	box-sizing: border-box;
	}
	
	input[type="text"]:focus,
	input[type="email"]:focus,
	input[type="tel"]:focus,
	select:focus{
	border-color:#b30000;
	outline: none;
	background-color: #fff5f5;
	}
	
	input[type="submit"],
	input[type="reset"]{
	padding: 10px, 20px;
	margin-top: 15px;
	margin-right: 10px;
	border: none;
	border-radius: 6px;
	cursor: pointer;
	font-size: 15px;
	}
input[type="submit"]{
	background-color: #b30000;
	color: white;}
	
	input[type="submit"]:hover{
	background-color: #ff4d4d;}
	
	input[type="reset"]{
	background-color: #ccc;
	color: #333;}
	
	input[type="reset"]:hover{
	background-color: #aaa;}
	</style>
</head>
<body>

    <h2 align="center">Heatwave Advisory Subscription Form</h2>

    <form>

        <label>Citizen Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Email Address:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Mobile Number:</label><br>
        <input type="tel" name="mobile" required><br><br>

       <label>Select Region:</label><br>
       <select name="region" required>
       <option value="">--Select Region--</option>
       <option>North India</option>
       <option>South India</option>
       <option>East India</option>
       <option>West India</option>
       <option>Central India</option>
       
       </select><br><br>
<label>Preferred Alert Language:</label><br>
        <input type="radio" name="language" value="English"> English<br>
        <input type="radio" name="language" value="Hindi"> Hindi<br>
        <input type="radio" name="language" value="Marathi"> Marathi<br><br>

        <label>Alert Types to Receive:</label><br>
        <input type="checkbox" name="alert" value="Heatwave Warning"> Heatwave Warning<br>
        <input type="checkbox" name="alert" value="Temperature Updates"> Temperature Updates<br>
        <input type="checkbox" name="alert" value="Health Advisory"> Health Advisory<br>
        <input type="checkbox" name="alert" value="Emergency Alerts"> Emergency Alerts<br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
