<html>
<head>

<style>
.offer-box{

border-radius: 8px;
animation: glow 1.5s infinite alternate;}

.offer-box marks{
font-size: 22px;
color:red;
background-color: transparent;}

@keyframes glow{
from{box-shadow: 0 0 5px #b30000;}
to{box-shadow: 0 0 25px #ff4d4d;}}
</style>
</head>

<body style="background-color: white">
<h1 style = "color:red;text-align:center;">
Heatwave Alert Bulletin
</h1>
<hr>
<h3>Current Alert:</h3>
<div class = "offer-box">
<p>
<strong>
<mark>Severe Heatwave Alert in Mumbai Region</mark>
</strong>
</p>
</div>
<p>
Maximum Temperature Expected : 47<sup>o</sup>C 
</p>
<p style = "color:blue">
Alert Status: Active
</p>
<hr>
<small>
Forecast subject to revision. Please check official weather updates
</small>
</body>
</html>
